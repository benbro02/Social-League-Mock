<html lang="en">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hoop Club — Social League</title>

  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }

<div id="root"></div>

    window.storage = {
      get: (key) => new Promise((resolve) => {
        try {
          const raw = localStorage.getItem('hoopclub_' + key);
          resolve(raw === null ? null : { key, value: raw });
        } catch (e) { resolve(null); }
      }),
      set: (key, value) => new Promise((resolve, reject) => {
        try {
          localStorage.setItem('hoopclub_' + key, value);
          resolve({ key, value });
        } catch (e) { reject(e); }
      }),
      delete: (key) => new Promise((resolve) => {
        try {
          localStorage.removeItem('hoopclub_' + key);
          resolve({ key, deleted: true });
        } catch (e) { resolve(null); }
      }),
      list: (prefix) => new Promise((resolve) => {
        try {
          const p = 'hoopclub_' + (prefix || '');
          const keys = Object.keys(localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice('hoopclub_'.length));
          resolve({ keys, prefix });
        } catch (e) { resolve({ keys: [], prefix }); }
      }),
    };
